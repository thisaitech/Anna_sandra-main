name: Build and Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: electron-build/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK local.properties
        run: |
          $sdk = $env:ANDROID_HOME.Replace("\", "/")
          "sdk.dir=$sdk" | Out-File -FilePath android\local.properties -Encoding ascii
        shell: pwsh

      - name: Install Electron Build Dependencies
        run: |
          cd electron-build
          npm ci

      - name: Build Windows Installer
        run: |
          powershell -ExecutionPolicy Bypass -File build-desktop.ps1

      - name: Build Android APK
        run: |
          powershell -ExecutionPolicy Bypass -File build-android-apk.ps1
        continue-on-error: true

      - name: Publish Windows installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-${{ github.run_number }}
          name: Sandra ERP Desktop Build ${{ github.run_number }}
          files: dist/downloads/windows/Sandra_ERP_Setup.exe
          make_latest: true
          generate_release_notes: true

      - name: Remove exe from dist (Spark plan forbids exe on Hosting)
        run: Remove-Item -Force dist\downloads\windows\Sandra_ERP_Setup.exe

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          npx firebase-tools deploy --only hosting --token "$env:FIREBASE_TOKEN"
