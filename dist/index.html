    <script>
      /* Offline: keep companyId + user session across app restarts */
      (function () {
        try {
          var PREFIX_PARTIES = 'thisai_crm_parties_';
          var PREFIX_ITEMS = 'thisai_crm_items_';
          var PREFIX_INVOICES = 'thisai_crm_invoices_';
          var cid = localStorage.getItem('app_offline_company_id');
          var raw = localStorage.getItem('user');
          var u = raw ? JSON.parse(raw) : null;
          if (u && u.companyId) {
            cid = u.companyId;
            localStorage.setItem('app_offline_company_id', cid);
          }
          if (!cid) {
            for (var i = 0; i < localStorage.length; i++) {
              var k = localStorage.key(i);
              if (!k) continue;
              if (k.indexOf(PREFIX_PARTIES) === 0 || k.indexOf(PREFIX_ITEMS) === 0 || k.indexOf(PREFIX_INVOICES) === 0) {
                var p = k.indexOf(PREFIX_PARTIES) === 0 ? PREFIX_PARTIES : (k.indexOf(PREFIX_ITEMS) === 0 ? PREFIX_ITEMS : PREFIX_INVOICES);
                cid = k.slice(p.length);
                if (cid) break;
              }
            }
            if (cid) localStorage.setItem('app_offline_company_id', cid);
          }
          if (!u && cid) {
            localStorage.setItem('user', JSON.stringify({
              uid: 'offline-local',
              email: '',
              displayName: 'Offline User',
              companyId: cid,
              role: 'super_admin',
              status: 'active'
            }));
          } else if (u && cid && !u.companyId) {
            u.companyId = cid;
            localStorage.setItem('user', JSON.stringify(u));
          }
          /* Offline: skip login if we already have a local session */
          if (typeof navigator !== 'undefined' && !navigator.onLine) {
            var path = location.pathname.replace(/\/$/, '') || '/';
            if (path === '/login' && localStorage.getItem('user')) {
              location.replace('/');
            }
          }
        } catch (e) {}
      })();
    </script>
